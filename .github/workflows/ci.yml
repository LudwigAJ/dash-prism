name: CI

on:
  push:
    branches: [main, dev]
  # No branch filter: a pull request onto a feature branch (a stacked pull
  # request) also gets the checks.
  pull_request:

# A new push to a pull request cancels the run for the earlier push. Runs for a
# push to main or dev always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Opt into Node.js 24 for JS-based actions (default June 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-py-version:
    name: Test Python@${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install Python dependencies (dev + test groups)
        run: poetry install --with dev,test --no-interaction

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript bundle
        run: pnpm run build

      - name: Run TypeScript unit tests
        run: pnpm run test:ts

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Verify Chrome version
        run: google-chrome --version || /usr/bin/google-chrome --version || echo "Chrome not found"

      # The pytest addopts in pyproject.toml write the coverage reports.
      - name: Run tests with coverage
        run: pnpm run test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: matrix.python-version == '3.12'
        with:
          name: coverage-reports-py${{ matrix.python-version }}
          path: |
            htmlcov/
            coverage.xml

      - name: Display coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          poetry run coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  test-dash-version:
    name: Test Dash@${{ matrix.dash-version }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        dash-version: ["3.1.1", "3.2.0", "3.3.0", "3.4.0", "4.0.0", "4.1.0", "4.2.0", "4.3.0", "4.4.1"]
        experimental: [false]
        include:
          # Tracks the latest stable Dash release. Non-blocking: a new upstream
          # release breaking us is informational, not a CI failure.
          - dash-version: "latest"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install Python dependencies (dev + test groups)
        run: poetry install --with dev,test --no-interaction

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript bundle
        run: pnpm run build

      # Build with the locked Dash first (as releases are built), then swap in the
      # target Dash for testing. Dash <3.4's component generator imports
      # pkg_resources, which setuptools 82+ no longer ships.
      # dash[testing] is reinstalled with deps because its Percy dependency changed
      # in 4.2 (percy -> percy-python-selenium); both provide a `percy` module.
      - name: Override Dash version
        run: |
          poetry run pip uninstall -y percy percy-python-selenium percy-selenium
          if [ "${{ matrix.dash-version }}" = "latest" ]; then
            poetry run pip install --upgrade "dash[testing]"
          else
            poetry run pip install "dash[testing]==${{ matrix.dash-version }}"
          fi
          poetry run python -c "import dash; print(f'Using Dash {dash.__version__}')"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Run tests
        run: pnpm run test

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies (dev group)
        run: poetry install --with dev --no-interaction

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Ruff, Black, mypy, ESLint and tsc, as the lint script in package.json defines.
      - name: Lint and type check
        run: pnpm run lint

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test-py-version, test-dash-version, lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies (dev group)
        run: poetry install --with dev --no-interaction

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript bundle
        run: pnpm run build

      - name: Build package
        run: poetry build

      - name: Check package with twine (optional but kept for extra validation)
        run: |
          python -m pip install twine
          poetry run twine check dist/*

      - name: Validate wheel contents and smoke test the install
        run: python scripts/check_wheel.py dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
