[project]
name = "dash_prism"
version = "1.0.0"
description = "Prism: Powerful multi-panel workspace manager for Plotly Dash"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Ludwig Jonsson", email = "developer-prism@protonmail.com"},
]
keywords = [
    "dash",
    "plotly",
    "plotly-dash",
    "dashboard",
    "workspace",
    "tabs",
    "panels",
    "layout",
    "ui",
    "components",
    "drag-and-drop",
]
requires-python = ">=3.11"
dynamic = ["classifiers", "dependencies"]

[project.urls]
Homepage = "https://github.com/LudwigAJ/dash-prism"
Repository = "https://github.com/LudwigAJ/dash-prism.git"
Documentation = "https://ludwigaj.github.io/dash-prism"

[tool.poetry]
# Classifiers kept here + listed in [project.dynamic] so Poetry auto-enriches
# (adds Python version + license classifiers automatically)
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Dash",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Include build artifacts in both sdist and wheel, even if gitignored
include = [
    { path = "dash_prism/*.js", format = ["sdist", "wheel"] },
    { path = "dash_prism/*.js.LICENSE.txt", format = ["sdist", "wheel"] },
    { path = "dash_prism/*.json", format = ["sdist", "wheel"] },
    { path = "dash_prism/*.py", format = ["sdist", "wheel"] },
    { path = "dash_prism/py.typed", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
dash = ">=3.1.1,<4.5"
# Layout parameter validation is built on pydantic v2. Dash >= 4.3 already
# depends on it; requiring it outright keeps one validation path for every
# supported Dash version.
pydantic = ">=2.10,<3"

[tool.poetry.group.dev.dependencies]
black = "==26.5.1"
mypy = "==1.20.2"
pyyaml = "^6.0.0"
ruff = "==0.15.12"
# setuptools 82+ removed pkg_resources. Dash <3.4's component generator imports it,
# but the locked Dash (used by dash-generate-components at build time) no longer does.
setuptools = ">=83.0.0,<84"
wheel = ">=0.45.0"
dash = {version = ">=3.1.1,<4.5", extras = ["dev", "async"]}

[tool.poetry.group.test.dependencies]
pytest = "^9.1.0"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
pytest-rerunfailures = "^16.3"
pyyaml = "^6.0.0"
selenium = "^4.0.0"
webdriver-manager = "^4.1.2"
dash = {version = ">=3.1.1,<4.5", extras = ["testing"]}

[tool.poetry.group.docs.dependencies]
furo = "^2025.12.19"

[tool.poetry.group.demo.dependencies]
numpy = "^1.24.0"
pandas = ">=1.5.0"

[build-system]
requires = ["poetry-core>=2.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--cov=dash_prism",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--headless",
]
markers = [
    "integration: marks tests as integration tests",
    "allow_console_errors(*texts): accept the browser console errors that hold one of the texts",
]
filterwarnings = [
    # dash[testing] caps selenium at 4.2.0, and that selenium needs urllib3 1.26. Selenium
    # calls HTTPResponse.getheader(), which urllib3 1.26 deprecates, for each WebDriver
    # command, so the warning came thousands of times in each run. The filter names no
    # module, because pytest.warns passes on a warning that it does not match with the
    # module "warnings", not the module of selenium.
    'ignore:HTTPResponse\.getheader\(\) is deprecated:DeprecationWarning',
]

[tool.black]
line-length = 100
target-version = ["py311", "py312", "py313", "py314"]
include = '\.pyi?$'
extend-exclude = '''
(
  \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | PrismComponent\.py$
  | PrismActionComponent\.py$
  | PrismContentComponent\.py$
  | _imports_\.py$
)
'''

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "dash_prism/PrismComponent.py",
    "dash_prism/PrismActionComponent.py",
    "dash_prism/PrismContentComponent.py",
    "dash_prism/_imports_.py",
]

[tool.ruff.lint]
select = [
    "F",       # unused imports and variables, shadowed names
    "I",       # import order
    "E402",    # import below other code
    "G",       # f-strings and str.format in logging calls
    "B006",    # mutable default argument
    "BLE001",  # blind "except Exception"
    "PLC1802", # len() as a condition
    "SIM118",  # "in dict.keys()"
    "S110",    # "except: pass" with any exception type (see flake8-bandit below)
    "PLC0415", # import inside a function
    "TID251",  # banned API (time.sleep, configured below)
    "RUF100",  # noqa comment that suppresses nothing
]
# registry.py has noqa comments for A002, a rule that this project does not select.
external = ["A002"]
# Enable "N818" (exception name without "Error") when the exception classes follow the suffix rule.

[tool.ruff.lint.flake8-bandit]
# S110 also reports "except SomeError: pass", not only a bare or blind except.
check-typed-exception = true

[tool.ruff.lint.isort]
known-first-party = ["dash_prism", "tests"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.sleep".msg = "Use the explicit waits in tests/integration/testutils.py."

[tool.ruff.lint.per-file-ignores]
# The public API imports follow the definitions in the same module. Move the imports to the top
# of the module to remove this entry.
"dash_prism/__init__.py" = ["E402"]
# Move the pydantic import to the top of the module to remove the E402 part of this entry.
# The slow demo layout sleeps on purpose.
"usage.py" = ["E402", "TID251"]
# The slow layouts under test sleep on purpose.
"tests/integration/test_layout_timeout.py" = ["TID251"]
"tests/test_init.py" = ["TID251"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
files = [
    "dash_prism/__init__.py",
    "dash_prism/Action.py",
    "dash_prism/icons.py",
    "dash_prism/app_init.py",
    "dash_prism/params.py",
    "dash_prism/Prism.py",
    "dash_prism/PrismContent.py",
    "dash_prism/registry.py",
    "dash_prism/utils.py",
    "scripts/check_wheel.py",
]

[tool.coverage.run]
source = ["dash_prism"]
omit = [
    "*/tests/*",
    "*/dash_prism/PrismComponent.py",
    "*/dash_prism/PrismActionComponent.py",
    "*/dash_prism/PrismContentComponent.py",
    "*/dash_prism/_imports_.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
